---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: bazarr-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        bazarr_debug_service_enabled: false

        # Variables for Bazarr
        bazarr_uid: 1000
        bazarr_gid: 1000
        bazarr_scheme: http
        bazarr_hostname: localhost
        bazarr_container_labels_traefik_enabled: false
        bazarr_container_http_host_bind_port: 6767

        # Neither the role's default (UTC) nor anything the image would settle
        # on by itself, so seeing Bazarr report it back proves that the env
        # template reached the process rather than merely the disk.
        bazarr_environment_variables_tz: Australia/Eucla

        # A marker no image default could produce, which verify.yml looks for
        # both in the rendered env file and in the running container's
        # environment, to prove the passthrough works end to end.
        bazarr_environment_variables_additional_variables: MASH_MOLECULE_MARKER=reached-the-process
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
