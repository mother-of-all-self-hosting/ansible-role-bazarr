---
- name: Verify Bazarr
  hosts: all
  become: true
  gather_facts: false

  vars:
    # Mirrors how `bazarr_base_path` and `bazarr_data_path` are derived in
    # defaults/main.yml. The mount assertion below cross-checks the result
    # against the path the role really handed to Docker, so a change to the
    # derivation surfaces as a failure rather than as a silently skipped check.
    bazarr_verify_base_path: "/bazarr"
    bazarr_verify_data_path: "{{ bazarr_verify_base_path }}/data"

    bazarr_verify_url: "http://{{ bazarr_hostname }}:{{ bazarr_container_http_port }}"

    bazarr_verify_wrong_api_key: "00000000000000000000000000000000"

    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    bazarr_expected_uid: 1717
    bazarr_expected_gid: 1717
    bazarr_expected_hostname: localhost
    bazarr_expected_path_prefix: /bazarr-ui
    bazarr_expected_timezone: Asia/Tokyo
    bazarr_expected_timezone_abbreviation: JST

    bazarr_verify_units:
      - bazarr.service

  tasks:
    - name: Verify that Bazarr works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: bazarr_defaults

        - name: Wait for the Bazarr systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: bazarr_services
          until: bazarr_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ bazarr_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Bazarr systemd services are active
          ansible.builtin.assert:
            that: bazarr_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(bazarr_verify_units | zip(bazarr_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Bazarr systemd services log for debugging
          when: bazarr_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ bazarr_verify_units }}"

        # Bazarr's HTTP port accepts connections only once its Flask application is
        # serving, and a published Docker port with nothing behind it makes the
        # kernel RESET the connection rather than refuse it - which the uri module
        # reports as status -1, not as a connection error worth retrying. Hence
        # `failed_when: false`, so that the retry loop rather than the first attempt
        # decides whether Bazarr came up.
        - name: Wait for the Bazarr API to start answering
          ansible.builtin.uri:
            url: "{{ bazarr_verify_url }}/api/system/status"
            method: GET
            status_code: [401]
            follow_redirects: none
          register: bazarr_verify_api_unauthenticated
          until: (bazarr_verify_api_unauthenticated.status | default(-1) | int) == 401
          retries: 60
          delay: 5
          failed_when: false

        # Bazarr's REST API is guarded by an API key that the application generates
        # for itself on first boot. If this ever returned 200, every Bazarr instance
        # deployed by this role would be handing its settings - subtitle provider
        # credentials included - to anyone who can reach the port.
        - name: Assert that the Bazarr API rejects unauthenticated requests
          ansible.builtin.assert:
            that: (bazarr_verify_api_unauthenticated.status | default(-1) | int) == 401
            fail_msg: >-
              The Bazarr API answered {{ bazarr_verify_api_unauthenticated.status | default('none') }}
              instead of 401 to a request carrying no API key.
            success_msg: The Bazarr API rejects unauthenticated requests

        - name: Inspect the Bazarr container
          ansible.builtin.command:
            cmd: docker container inspect bazarr
          register: bazarr_container_raw
          changed_when: false

        - name: Parse the Bazarr container definition
          ansible.builtin.set_fact:
            bazarr_container: "{{ (bazarr_container_raw.stdout | from_json)[0] }}"

        # ------------------------------------------------------------------
        # What the role told Docker to run
        # ------------------------------------------------------------------

        - name: Collect the mounts the role asked for
          ansible.builtin.set_fact:
            bazarr_config_mount: "{{ bazarr_container.Mounts | selectattr('Destination', 'equalto', '/config') | list }}"
            bazarr_extra_mount: "{{ bazarr_container.Mounts | selectattr('Destination', 'equalto', bazarr_molecule_extra_volume_dst) | list }}"

        - name: Assert that the role's data path is mounted at /config
          ansible.builtin.assert:
            that:
              - bazarr_config_mount | length == 1
              - bazarr_config_mount[0].Type == 'bind'
              - bazarr_config_mount[0].RW
            fail_msg: "The role's data path is not bind-mounted at /config: {{ bazarr_container.Mounts }}"
            success_msg: "{{ bazarr_config_mount[0].Source | default('?') }} is bind-mounted at /config"

        # bazarr_container_additional_volumes_custom has been inert in several roles in
        # this collection - rendered into a comment, or into a `-v` that silently
        # dropped the options. Both the destination and the readonly option have
        # to arrive.
        - name: Assert that bazarr_container_additional_volumes_custom reached the container
          ansible.builtin.assert:
            that:
              - bazarr_extra_mount | length == 1
              - bazarr_extra_mount[0].Type == 'bind'
              - bazarr_extra_mount[0].Source == bazarr_molecule_extra_volume_src
              - not bazarr_extra_mount[0].RW
            fail_msg: "The additional volume did not reach the container: {{ bazarr_container.Mounts }}"
            success_msg: "The additional volume is mounted read-only at {{ bazarr_molecule_extra_volume_dst }}"

        # Reading the file back from inside the
        # container is the difference between the variable existing and it working.
        - name: Read the marker through the additional volume
          ansible.builtin.command:
            cmd: >-
              docker exec bazarr
              cat {{ bazarr_molecule_extra_volume_dst }}/{{ bazarr_molecule_marker_filename }}
          register: bazarr_extra_volume
          changed_when: false

        - name: Assert the additional volume is mounted into the Bazarr container
          ansible.builtin.assert:
            that:
              - bazarr_extra_volume.rc == 0
              - bazarr_extra_volume.stdout | trim == bazarr_molecule_extra_volume_marker
            fail_msg: "The additional volume did not carry the marker into the container"
            success_msg: "The additional volume carries the marker into the container"

        # The `docker create` line in templates/systemd/bazarr.service.j2 has a
        # comment sitting in the middle of a backslash continuation, right in front
        # of the tmpfs that linuxserver.io's read-only mode needs. systemd drops
        # such a comment rather than passing it on to docker, but that is worth
        # holding onto: if it ever stopped doing so, everything after the comment
        # would silently become part of the image name.
        - name: Assert that the read-only container still gets its writable /run
          ansible.builtin.assert:
            that:
              - bazarr_container.HostConfig.ReadonlyRootfs
              - "'/run' in (bazarr_container.HostConfig.Tmpfs | default({}))"
              - "'exec' in bazarr_container.HostConfig.Tmpfs['/run']"
            fail_msg: >-
              The container's root filesystem is
              {{ 'read-only' if bazarr_container.HostConfig.ReadonlyRootfs else 'writable' }}
              and its tmpfs mounts are {{ bazarr_container.HostConfig.Tmpfs | default({}) }}
            success_msg: "The container is read-only with an exec tmpfs at /run"

        - name: Assert that the role's uid and gid reached the container
          ansible.builtin.assert:
            that:
              - bazarr_container.Config.User == (bazarr_expected_uid | string) ~ ':' ~ (bazarr_expected_gid | string)
              - ('PUID=' ~ bazarr_expected_uid) in bazarr_container.Config.Env
              - ('PGID=' ~ bazarr_expected_gid) in bazarr_container.Config.Env
            fail_msg: >-
              The container runs as {{ bazarr_container.Config.User }}
              with {{ bazarr_container.Config.Env | select('match', 'P[UG]ID=') | list }}
            success_msg: "The container runs as {{ bazarr_container.Config.User }} and carries the matching PUID/PGID"

        - name: Assert that the role's timezone reached the container environment
          ansible.builtin.assert:
            that:
              - ('TZ=' ~ bazarr_expected_timezone) in bazarr_container.Config.Env
            fail_msg: "templates/env.j2 did not put TZ={{ bazarr_expected_timezone }} on the container"
            success_msg: "The container environment carries TZ={{ bazarr_expected_timezone }}"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that:
              - bazarr_container.Config.Image == 'ghcr.io/linuxserver/bazarr:' ~ bazarr_defaults.bazarr_version
            fail_msg: >-
              The container runs {{ bazarr_container.Config.Image }}, not the
              {{ bazarr_defaults.bazarr_version }} pinned in defaults/main.yml
            success_msg: "The container runs {{ bazarr_container.Config.Image }}"

        # linuxserver.io stamps its own build onto the image as
        # `v<Bazarr version>-ls<rebuild counter>`. The trailing `-ls` matters:
        # without it, a pin of 0.24.187 would happily match 0.24.1870-ls403.
        - name: Assert the running Bazarr is the version this role installs
          ansible.builtin.assert:
            that: bazarr_container.Config.Labels['org.opencontainers.image.version'] is match('v' ~ (bazarr_defaults.bazarr_version | regex_escape) ~ '-ls[0-9]+$')
            fail_msg: "Bazarr reports {{ bazarr_container.Config.Labels['org.opencontainers.image.version'] | default('none') }}, expected {{ bazarr_defaults.bazarr_version }}"
            success_msg: "Bazarr reports {{ bazarr_container.Config.Labels['org.opencontainers.image.version'] }}"

        # ------------------------------------------------------------------
        # Traefik labels
        # ------------------------------------------------------------------

        - name: Assert that the Traefik labels describe the configured hostname and path prefix
          ansible.builtin.assert:
            that:
              - bazarr_container.Config.Labels['traefik.enable'] == 'true'
              - bazarr_container.Config.Labels['traefik.http.routers.bazarr.rule'] == 'Host(`' ~ bazarr_expected_hostname ~ '`) && PathPrefix(`' ~ bazarr_expected_path_prefix ~ '`)'
              - bazarr_container.Config.Labels['traefik.http.middlewares.bazarr-strip-prefix.stripprefix.prefixes'] == bazarr_expected_path_prefix
              - bazarr_container.Config.Labels['traefik.http.services.bazarr.loadbalancer.server.port'] == '6767'
            fail_msg: "The Traefik labels are not what templates/labels.j2 should have produced: {{ bazarr_container.Config.Labels }}"
            success_msg: "The Traefik labels route {{ bazarr_expected_hostname }}{{ bazarr_expected_path_prefix }} to port 6767"

        - name: Assert that the additional labels and extra arguments reached the container
          ansible.builtin.assert:
            that:
              - bazarr_container.Config.Labels['mash.molecule.additional-label'] == 'set-by-the-role'
              - bazarr_container.Config.Labels['mash.molecule.extra-argument'] == 'set-by-the-role'
            fail_msg: >-
              bazarr_container_labels_additional_labels or
              bazarr_container_extra_arguments did not reach the container:
              {{ bazarr_container.Config.Labels }}
            success_msg: "The additional label and the extra argument both reached the container"

        # ------------------------------------------------------------------
        # What the process inside the container actually sees
        # ------------------------------------------------------------------

        - name: Ask the Bazarr container which timezone and user it is running in
          ansible.builtin.command:
            cmd: docker exec bazarr sh -c 'date +%Z; id -u; id -g'
          register: bazarr_process_identity
          changed_when: false

        - name: Assert that the Bazarr process runs in the role's timezone, as the role's user
          ansible.builtin.assert:
            that:
              - bazarr_process_identity.stdout_lines[0] == bazarr_expected_timezone_abbreviation
              - bazarr_process_identity.stdout_lines[1] == bazarr_expected_uid | string
              - bazarr_process_identity.stdout_lines[2] == bazarr_expected_gid | string
            fail_msg: >-
              The container reports zone/uid/gid {{ bazarr_process_identity.stdout_lines }},
              expected [{{ bazarr_expected_timezone_abbreviation }},
              {{ bazarr_expected_uid }}, {{ bazarr_expected_gid }}]
            success_msg: >-
              The Bazarr process runs in {{ bazarr_process_identity.stdout_lines[0] }}
              as {{ bazarr_process_identity.stdout_lines[1] }}:{{ bazarr_process_identity.stdout_lines[2] }}

        # ------------------------------------------------------------------
        #
        # ------------------------------------------------------------------

        # Bazarr writes its own configuration file; the role only provides the
        # directory it lives in. Reading it back from the role's data path proves
        # both that the bind mount is in effect and where the API key comes from.
        - name: Read the configuration file Bazarr generated on the role's data path
          ansible.builtin.slurp:
            src: "{{ bazarr_verify_data_path }}/config/config.yaml"
          register: bazarr_verify_config_file

        - name: Parse the configuration file Bazarr generated
          ansible.builtin.set_fact:
            bazarr_verify_config: "{{ bazarr_verify_config_file.content | b64decode | from_yaml }}"

        # `bazarr_container_http_port` is the port the role publishes and points
        # Traefik at. Bazarr itself takes its port from this file, which the role
        # does not template, and the image's own readiness check is hardwired to
        # 6767 - so the two have to agree or nothing would be reachable. Asserting
        # the agreement here is what keeps the pair from drifting apart unnoticed.
        - name: Assert that Bazarr listens on the port the role publishes
          ansible.builtin.assert:
            that: (bazarr_verify_config.general.port | int) == (bazarr_defaults.bazarr_container_http_port | int)
            fail_msg: >-
              Bazarr listens on {{ bazarr_verify_config.general.port }} while the role publishes
              {{ bazarr_defaults.bazarr_container_http_port }}.
            success_msg: "Bazarr listens on the published port {{ bazarr_verify_config.general.port }}"

        # Bazarr ships no authentication on its web interface out of the box. The
        # role compensates by putting Traefik HTTP Basic authentication in front of
        # it by default; see docs/configuring-bazarr.md. Should upstream ever start
        # defaulting to an authentication method of its own, this assertion is meant
        # to fail so the documentation and the default can be revisited.
        - name: Assert that Bazarr's own web interface authentication is still off by default
          ansible.builtin.assert:
            that: bazarr_verify_config.auth.type is none
            fail_msg: >-
              Bazarr now defaults its web interface authentication to
              `{{ bazarr_verify_config.auth.type }}`; docs/configuring-bazarr.md and
              `bazarr_container_labels_traefik_middleware_basic_auth_enabled` need revisiting.
            success_msg: Bazarr still ships without web interface authentication, as the role's documentation states

        - name: Query the Bazarr system status endpoint with the generated API key
          ansible.builtin.uri:
            url: "{{ bazarr_verify_url }}/api/system/status"
            method: GET
            headers:
              X-API-KEY: "{{ bazarr_verify_config.auth.apikey }}"
            status_code: [200]
            follow_redirects: none
          register: bazarr_verify_status

        - name: Assert that Bazarr reports the version, timezone and storage the role configured
          ansible.builtin.assert:
            that:
              - bazarr_verify_status.json.data.bazarr_version == bazarr_defaults.bazarr_version
              - bazarr_verify_status.json.data.package_version is match('^v' ~ (bazarr_defaults.bazarr_version | regex_escape) ~ '-ls[0-9]+ ')
              - bazarr_verify_status.json.data.timezone == bazarr_environment_variables_tz
              - bazarr_verify_status.json.data.bazarr_config_directory == '/config'
              - bazarr_verify_status.json.data.database_engine is match('^Sqlite ')
            fail_msg: "Bazarr reports {{ bazarr_verify_status.json.data }}"
            success_msg: >-
              Bazarr {{ bazarr_verify_status.json.data.bazarr_version }}
              ({{ bazarr_verify_status.json.data.package_version }}) is running in
              {{ bazarr_verify_status.json.data.timezone }} on {{ bazarr_verify_status.json.data.database_engine }}

        # The counterpart of the unauthenticated check: it is the instance's own
        # generated key that opens the API, not the mere presence of a header.
        - name: Query the Bazarr system status endpoint with an API key that is not this instance's
          ansible.builtin.uri:
            url: "{{ bazarr_verify_url }}/api/system/status"
            method: GET
            headers:
              X-API-KEY: "{{ bazarr_verify_wrong_api_key }}"
            status_code: [401]
            follow_redirects: none
          register: bazarr_verify_wrong_key

        - name: Assert that only this instance's API key is accepted
          ansible.builtin.assert:
            that: bazarr_verify_wrong_key.status == 401
            fail_msg: "The Bazarr API accepted an API key that is not this instance's ({{ bazarr_verify_wrong_key.status }})"
            success_msg: The Bazarr API accepts only this instance's own API key

        # Bazarr runs its Alembic migrations on every start, against a SQLite
        # database that lives on the role's data path. Its presence, its schema and
        # its stamped migration revision are what a version bump would put at risk.
        - name: Query the Bazarr SQLite database
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json
                import sqlite3
                import sys

                connection = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
                print(json.dumps({
                    "tables": sorted(row[0] for row in connection.execute(
                        "SELECT name FROM sqlite_master WHERE type = 'table'")),
                    "revisions": [row[0] for row in connection.execute(
                        "SELECT version_num FROM alembic_version")],
                }))
              - "{{ bazarr_verify_data_path }}/db/bazarr.db"
          register: bazarr_verify_database
          changed_when: false

        - name: Assert that Bazarr created and migrated its database on the role's data path
          ansible.builtin.assert:
            that:
              - "'table_shows' in (bazarr_verify_database.stdout | from_json).tables"
              - "'table_movies' in (bazarr_verify_database.stdout | from_json).tables"
              - "'alembic_version' in (bazarr_verify_database.stdout | from_json).tables"
              - (bazarr_verify_database.stdout | from_json).revisions | length == 1
            fail_msg: >-
              {{ bazarr_verify_data_path }}/db/bazarr.db does not hold a migrated Bazarr schema:
              {{ bazarr_verify_database.stdout }}
            success_msg: >-
              Bazarr migrated its database to revision
              {{ (bazarr_verify_database.stdout | from_json).revisions | first }}
              on {{ bazarr_verify_data_path }}

        # The container is read-only with a tmpfs on /run, so everything Bazarr
        # needs to keep has to land on the bind mount. Restarting the service and
        # finding the same instance behind the API is what proves it did.
        - name: Restart the Bazarr systemd service
          ansible.builtin.systemd_service:
            name: bazarr.service
            state: restarted

        - name: Wait for the restarted Bazarr to serve its API again
          ansible.builtin.uri:
            url: "{{ bazarr_verify_url }}/api/system/status"
            method: GET
            headers:
              X-API-KEY: "{{ bazarr_verify_config.auth.apikey }}"
            status_code: [200]
            follow_redirects: none
          register: bazarr_verify_status_after_restart
          until: (bazarr_verify_status_after_restart.status | default(-1) | int) == 200
          retries: 60
          delay: 5
          failed_when: false

        - name: Assert that Bazarr survived a restart with its state intact
          ansible.builtin.assert:
            that:
              - (bazarr_verify_status_after_restart.status | default(-1) | int) == 200
              - bazarr_verify_status_after_restart.json.data.start_time > bazarr_verify_status.json.data.start_time
            fail_msg: >-
              After a restart, Bazarr answered
              {{ bazarr_verify_status_after_restart.status | default('none') }}
              to the API key it generated before the restart.
            success_msg: Bazarr restarted and still answers to the API key it persisted on the role's data path

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "bazarr_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: bazarr_restarts_before
              loop: "{{ bazarr_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: bazarr_restarts_after
              loop: "{{ bazarr_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - bazarr_restarts_after.results | map(attribute='status.NRestarts') | list == bazarr_restarts_before.results | map(attribute='status.NRestarts') | list
                  - bazarr_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in bazarr_verify_units | zip(bazarr_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in bazarr_verify_units | zip(bazarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in bazarr_verify_units | zip(bazarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Bazarr verification summary
          ansible.builtin.debug:
            msg:
              - "Bazarr systemd: {% for unit, state in bazarr_verify_units | zip(bazarr_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Bazarr restarts: {% for unit, restarts in bazarr_verify_units | zip(bazarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Bazarr version: {{ bazarr_verify_status.json.data.bazarr_version }}"
              - "Bazarr image: {{ bazarr_container.Config.Image }} ({{ bazarr_container.Config.Labels['org.opencontainers.image.version'] }})"
              - "Bazarr timezone: {{ bazarr_verify_status.json.data.timezone }}"
              - "Bazarr database: {{ bazarr_verify_status.json.data.database_engine }} at revision {{ (bazarr_verify_database.stdout | from_json).revisions | first }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Bazarr systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=bazarr.service
          register: bazarr_service_log
          changed_when: false

        - name: Show the Bazarr systemd service log
          ansible.builtin.debug:
            var: bazarr_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Bazarr verification failed. The systemd service log is printed above."
